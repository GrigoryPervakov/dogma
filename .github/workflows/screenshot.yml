name: screenshot

# Render the README screenshot from the real UI on every push and publish it to
# GitHub Pages, so the image lives in CI artifacts instead of the git tree.
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "examples/screenshot.rs"
      - ".github/workflows/screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time; never cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install librsvg + monospace font
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-dejavu-core

      - name: Render terminal screenshot
        run: |
          mkdir -p site
          cargo run --example screenshot > site/dogma.svg
          rsvg-convert -w 800 -h 600 site/dogma.svg -o site/dogma.png

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
